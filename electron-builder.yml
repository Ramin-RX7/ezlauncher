appId: com.ezlauncher.app
productName: ezlauncher
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  category: Game
mac:
  target: [dmg]
  category: public.app-category.games
